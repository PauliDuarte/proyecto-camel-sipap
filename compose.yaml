services:
  artemis:
    image: apache/activemq-artemis:2.44.0-alpine
    container_name: sipap-artemis
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "true"
      ARTEMIS_JOURNAL_TYPE: NIO
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD", "/opt/activemq-artemis/bin/artemis", "check", "node", "--url", "tcp://localhost:61616", "--user", "artemis", "--password", "artemis", "--silent", "--timeout", "5000"]
      interval: 10s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: sipap-wiremock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
